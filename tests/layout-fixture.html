<style>
* { box-sizing:border-box; } html, body { height:100%; } body { margin:0; font:15px/1.5 system-ui; }
.layout { display:flex; width:100%; }

.columns-shell { width:990px; } .columns { display:flex; justify-content:space-between; width:100%; }
.nav-inner { width:275px; height:100%; padding:0 12px; display:flex; flex-direction:column; }

.account { margin-top:auto; padding:20px; }
[data-testid="primaryColumn"] { width:600px; max-width:600px; min-width:0; flex:0 1 600px; border:1px solid #2f3336; }
[data-testid="primaryColumn"] > div { min-height:5000px; }
.toolbar { position:sticky; top:0; z-index:3; } .native-toolbar-inner { height:54px; padding:12px 16px; background:rgba(0,0,0,.65); }
.composer { background:#000; } .composer-inner { background:#000; padding:16px; display:flex; gap:12px; } .editor { flex:1; }
[data-testid="tweetTextarea_0"] { height:60px; } .composer-actions { background:#000; position:sticky; height:80px; }
.suggestions { background:#000; padding:8px; } button { padding:8px 16px; border:0; border-radius:30px; }
.avatar { width:40px; height:40px; background:#000; border-radius:50%; flex-shrink:0; }
.avatar img { width:100%; height:100%; border-radius:inherit; }
article { padding:12px 16px; } .cell-shell { border-bottom:1px solid #2f3336; }
.reply-group article { padding:0 16px; } .reply-row { display:flex; gap:12px; padding-top:12px; } .avatar-rail { width:40px; position:relative; flex-shrink:0; }
.r-m5arl1 { width:2px; background:#333639; margin-inline:auto; } .reply-down { height:80px; } .reply-up { position:absolute; top:-12px; left:19px; height:12px; }
.photo { width:100%; height:160px; background:#000; margin-top:16px; border-radius:14px; }
.photo img { width:100%; height:100%; object-fit:contain; }
[data-testid="sidebarColumn"] { width:350px; padding-left:30px; }
.search-shell { background:#000; position:fixed; width:320px; height:54px; }
form { margin-top:6px; padding:10px 16px; } input { background:transparent; color:inherit; border:0; }
.r-1phboty.r-1ifxtd0 { padding:16px; margin-top:70px; border:1px solid #2f3336; border-radius:16px; }
h1,h2 { margin:0; } h2 { font-size:20px; }
@media(max-width:1264px) { header > div, .nav-inner { width:88px; } nav a > div { width:48px; overflow:hidden; white-space:nowrap; } .account { padding:8px; overflow:hidden; } }
</style><style>{{css}}</style><script>{{adapter}}</script><script>{{settings}}</script></head>
<body style="background-color:rgb(0,0,0);color:rgb(231,233,234)"><div class="layout">

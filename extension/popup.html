<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XGlow</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img class="brand" src="icons/icon-48.png" width="40" height="40" alt="">
    <div>
      <h1>XGlow</h1>
      <p>Appearance</p>
    </div>
    <label class="sr-only" for="enabled">Enable XGlow</label>
    <input class="switch" id="enabled" type="checkbox" role="switch">
  </header>

  <div class="tabs" role="tablist" aria-label="Appearance settings">
    <button type="button" id="themesTab" role="tab" aria-selected="true" aria-controls="themesPanel" data-settings-tab="themesPanel">Themes</button>
    <button type="button" id="detailsTab" role="tab" aria-selected="false" aria-controls="detailsPanel" tabindex="-1" data-settings-tab="detailsPanel">Fine-tune</button>
  </div>
  <main>
    <section id="themesPanel" role="tabpanel" aria-labelledby="themesTab">
      <fieldset>
        <legend>Theme</legend>
        <div class="theme-options" id="themeOptions"></div>
      </fieldset>
      <div id="colorOptions" class="color-options is-collapsed" aria-hidden="true" inert>
        <div class="color-options-inner">
      <fieldset id="colors">
        <legend>Color</legend>
        <div class="swatches">
          <button type="button" data-accent="aurora" aria-pressed="false"><i></i>Aurora</button>
          <button type="button" data-accent="ocean" aria-pressed="false"><i></i>Ocean</button>
          <button type="button" data-accent="forest" aria-pressed="false"><i></i>Green</button>
          <button type="button" data-accent="ruby" aria-pressed="false"><i></i>Red</button>
          <button type="button" data-accent="rose" aria-pressed="false"><i></i>Rose</button>
          <button type="button" data-accent="amber" aria-pressed="false"><i></i>Amber</button>
          <button type="button" data-accent="silver" aria-pressed="false"><i></i>Silver</button>
          <button type="button" data-accent="custom" aria-pressed="false"><i></i>Custom</button>
        </div>
      </fieldset>
      <div id="customControls" class="custom-color" hidden>
        <label for="customColor">Custom color</label>
        <input id="customColor" type="color">
        <input id="customHex" type="text" aria-label="HEX color code" maxlength="7" spellcheck="false" autocomplete="off" placeholder="#22c55e">
      </div>
        </div>
      </div>
    </section>
    <section id="detailsPanel" role="tabpanel" aria-labelledby="detailsTab" hidden>
      <fieldset>
        <legend>Effects</legend>
        <div class="control-group effects">
          <div class="slider-label"><label for="tint">Tint intensity</label><output id="tintValue" for="tint"></output></div>
          <input id="tint" type="range" min="0" max="100" step="1" aria-description="How much color is added to the glass and background">
          <div class="slider-label"><label for="blur">Blur</label><output id="blurValue" for="blur"></output></div>
          <input id="blur" type="range" min="0" max="40" step="1">
          <div class="slider-label"><label for="opacity">Glass opacity</label><output id="opacityValue" for="opacity"></output></div>
          <input id="opacity" type="range" min="0" max="90" step="1">
        </div>
      </fieldset>
      <fieldset>
        <legend>Layout & performance</legend>
        <div class="control-group">
          <div class="row">
            <div><label for="sidebar">Right sidebar</label></div>
            <input class="switch" id="sidebar" type="checkbox" role="switch" aria-description="Trends, news and suggestions">
          </div>
          <div class="row">
            <div><label for="lite">Lightweight mode</label></div>
            <input class="switch" id="lite" type="checkbox" role="switch" aria-description="Reduce blur for better performance">
          </div>
        </div>
      </fieldset>
    </section>
  </main>

  <footer>
    <div class="save-state"><span id="status" role="status">Saved on this device</span><span class="version" id="version">0.3.0</span></div>
    <button id="reset" type="button">Reset</button>
  </footer>
  <script src="settings.js"></script><script src="popup.js"></script>
</body>
</html>
